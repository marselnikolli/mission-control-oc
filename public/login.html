<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control — Sign in</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #070f18; --card: #101f2e; --card-hi: #16293b; --line: #24405a;
    --ink: #e4edf4; --muted: #83a0b5; --faint: #4d6477;
    --thinking: #5ecdf2; --executing: #b39bff; --error: #ff7a68;
    --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg: #eef2f5; --card: #ffffff; --card-hi: #f6f9fb; --line: #bccad6;
      --ink: #15232f; --muted: #57697a; --faint: #93a4b3;
      --thinking: #1f8fb3; --executing: #6b55d6; --error: #c9443a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body {
    display: flex; align-items: center; justify-content: center; padding: 20px;
    background-image: radial-gradient(color-mix(in srgb, var(--thinking) 30%, transparent) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  button:focus-visible, input:focus-visible { outline: 2px solid var(--thinking); outline-offset: 2px; }
  .card {
    width: 100%; max-width: 340px;
    background: radial-gradient(140% 160% at 15% -10%, var(--card-hi), var(--card));
    border: 1px solid var(--line); border-radius: 26px; padding: 26px 24px;
    box-shadow: 0 0 0 1px rgba(94,205,242,.06), 0 24px 60px -24px rgba(0,0,0,.7), 0 0 40px -20px var(--thinking);
    backdrop-filter: blur(8px);
  }
  .brand { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 15px; letter-spacing: -0.01em; margin-bottom: 20px; }
  .brand .logo { width: 26px; height: 26px; border-radius: 50%; flex: none; background: linear-gradient(135deg, var(--thinking), var(--executing)); display: inline-flex; align-items: center; justify-content: center; color: #fff; font-size: 14px; box-shadow: 0 0 18px -2px var(--thinking); }
  h1 { font-size: 15px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin: 0 0 18px; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 14px 0 4px; }
  input { width: 100%; padding: 9px 12px; border-radius: 14px; border: 1px solid var(--line); background: transparent; color: var(--ink); font: inherit; }
  input:focus { border-color: var(--thinking); }
  button { margin-top: 20px; width: 100%; padding: 9px 0; border-radius: 999px; border: 1px solid transparent; background: linear-gradient(135deg, var(--thinking), var(--executing)); color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  button:hover { filter: brightness(1.06); }
  button[disabled] { opacity: .5; cursor: default; filter: none; }
  #err { color: var(--error); font-size: 13px; margin-top: 12px; min-height: 16px; }
</style>
</head>
<body>
<div class="card">
  <div class="brand"><span class="logo">◆</span><span>Mission Control</span></div>
  <h1>Sign in</h1>
  <p class="sub">Restricted area — authenticate to continue.</p>
  <form id="f">
    <label for="u">Username</label>
    <input id="u" name="username" autocomplete="username" required>
    <label for="p">Password</label>
    <input id="p" name="password" type="password" autocomplete="current-password" required>
    <div id="err" role="alert"></div>
    <button type="submit">Sign in</button>
  </form>
</div>
<script>
  const f = document.getElementById('f'), err = document.getElementById('err');
  f.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const btn = f.querySelector('button'); btn.disabled = true;
    try {
      const r = await fetch('/api/login', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({ username: f.username.value, password: f.password.value }),
      });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || 'Sign in failed');
      location.href = '/';
    } catch (e2) {
      err.textContent = e2.message;
      btn.disabled = false;
    }
  });
</script>
</body>
</html>
