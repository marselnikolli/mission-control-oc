<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d1924; --grid: #16283a; --card: #132332; --card-hi: #182c3e; --line: #29435a;
    --ink: #dfe8ef; --muted: #8198ab; --faint: #4d6477;
    --thinking: #6cc4e0; --executing: #a795f2; --waiting: #ecbc4f; --done: #7cc79c; --error: #ef7266;
    --sans: "Instrument Sans", "Segoe UI", system-ui, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #eef2f5; --grid: #dde5ec; --card: #ffffff; --card-hi: #f6f9fb; --line: #bccad6;
      --ink: #15232f; --muted: #57697a; --faint: #93a4b3;
      --thinking: #1f8fb3; --executing: #6b55d6; --waiting: #b78510; --done: #2f8f58; --error: #c9443a;
    }
  }
  :root[data-theme="light"] {
    --bg: #eef2f5; --grid: #dde5ec; --card: #ffffff; --card-hi: #f6f9fb; --line: #bccad6;
    --ink: #15232f; --muted: #57697a; --faint: #93a4b3;
    --thinking: #1f8fb3; --executing: #6b55d6; --waiting: #b78510; --done: #2f8f58; --error: #c9443a;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 340px; height: 100vh; overflow: hidden; }
  button { font: inherit; color: inherit; }
  button:focus-visible { outline: 2px solid var(--thinking); outline-offset: 2px; }

  header { grid-column: 1 / -1; display: flex; align-items: center; gap: 18px; padding: 12px 20px; border-bottom: 1px solid var(--grid); min-width: 0; }
  .mission { min-width: 0; flex: 1; }
  .mission small { display: block; color: var(--muted); font-size: 12px; }
  .mission h1 { margin: 2px 0 0; font-size: 19px; font-weight: 600; letter-spacing: -0.01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .clock { font-family: var(--mono); font-size: 14px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .conn { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 6px 12px; border-radius: 999px; border: 1px solid var(--line); white-space: nowrap; }
  .conn i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .conn[data-s="live"] i { background: var(--done); }
  .conn[data-s="demo"] i { background: var(--executing); }
  .conn[data-s="reconnecting"] i, .conn[data-s="connecting"] i { background: var(--waiting); }
  .conn[data-s="error"] i { background: var(--error); }
  .tbtn { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; cursor: pointer; }
  .tbtn:hover { background: var(--card-hi); }
  .tbtn[disabled] { opacity: .45; cursor: default; }

  #stage { position: relative; overflow: hidden; cursor: grab;
    background-image: radial-gradient(var(--grid) 1px, transparent 1px); background-size: 28px 28px; }
  #stage.dragging { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; }
  #edges { position: absolute; left: 0; top: 0; overflow: visible; width: 1px; height: 1px; }
  #edges path.edge { fill: none; stroke: var(--line); stroke-width: 1.6; transition: stroke .4s; }
  #edges path.edge.hot { stroke: var(--thinking); }

  .node { position: absolute; left: 0; top: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; transition: border-color .3s, box-shadow .3s, opacity .4s; }
  .node:hover { background: var(--card-hi); }
  .node.selected { border-color: var(--ink); }
  .node .row { display: flex; align-items: center; gap: 8px; }
  .node .name { font-weight: 600; font-size: 15px; text-transform: capitalize; }
  .node .st { display: flex; align-items: center; gap: 7px; font-size: 13px; color: var(--muted); margin-top: 6px; }
  .node .st i { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); flex: none; }
  .node .detail { font-family: var(--mono); font-size: 12px; color: var(--ink); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .meta { font-size: 11.5px; color: var(--faint); margin-top: 6px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node[data-status="thinking"] { border-color: var(--thinking); }
  .node[data-status="executing"] { border-color: var(--executing); }
  .node[data-status="waiting"] { border-color: var(--waiting); }
  .node[data-status="error"] { border-color: var(--error); }
  .node[data-status="thinking"] .st i { background: var(--thinking); }
  .node[data-status="executing"] .st i { background: var(--executing); }
  .node[data-status="waiting"] .st i { background: var(--waiting); }
  .node[data-status="done"] .st i { background: var(--done); }
  .node[data-status="error"] .st i { background: var(--error); }
  .node[data-status="thinking"], .node[data-status="executing"] { animation: breathe 2.4s ease-in-out infinite; }
  .node[data-status="executing"] { --glow: var(--executing); }
  .node[data-status="thinking"] { --glow: var(--thinking); }
  @keyframes breathe { 0%,100% { box-shadow: 0 0 0 0 transparent; } 50% { box-shadow: 0 0 22px -4px var(--glow); } }
  .node.flash { box-shadow: 0 0 0 3px var(--flash, var(--done)); }

  .node.mission { border-radius: 999px; padding: 12px 22px; text-align: center; }
  .node.mission .name { text-transform: none; font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node.agent[data-status="idle"] { opacity: .78; }
  .node.tool { padding: 8px 12px; border-radius: 8px; }
  .node.tool .detail { margin-top: 0; }
  .node.tool .st { margin-top: 3px; font-size: 12px; }
  .node.approval { border-width: 1.5px; }
  .node.approval .actions { display: flex; gap: 8px; margin-top: 10px; }
  .node.approval .actions button { flex: 1; border-radius: 7px; padding: 6px 0; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid var(--line); background: transparent; }
  .node.approval .actions .yes { background: var(--waiting); color: #1d1405; border-color: var(--waiting); }
  .node.approval .actions button[disabled] { opacity: .45; cursor: not-allowed; }

  .particle { fill: var(--thinking); }
  .particle.exec { fill: var(--executing); }
  .particle.result { fill: var(--done); }
  .particle.approval { fill: var(--waiting); }
  .particle.error { fill: var(--error); }

  #recenter { position: absolute; right: 16px; bottom: 16px; }
  #empty { position: absolute; left: 50%; bottom: 28px; transform: translateX(-50%); color: var(--muted); font-size: 13px; pointer-events: none; }

  aside { border-left: 1px solid var(--grid); display: grid; grid-template-rows: auto 1fr; min-height: 0; }
  #inspector { padding: 16px 18px; border-bottom: 1px solid var(--grid); min-height: 120px; }
  #inspector h2, #feed h2 { font-size: 13px; font-weight: 600; color: var(--muted); margin: 0 0 10px; }
  #inspector .big { font-size: 17px; font-weight: 600; text-transform: capitalize; }
  #inspector dl { display: grid; grid-template-columns: 70px 1fr; gap: 6px 10px; margin: 12px 0 0; font-size: 13px; }
  #inspector dt { color: var(--muted); }
  #inspector dd { margin: 0; overflow-wrap: anywhere; }
  #inspector code { font-family: var(--mono); font-size: 12px; }
  #feed { padding: 16px 18px; overflow-y: auto; min-height: 0; }
  #feed ol { list-style: none; margin: 0; padding: 0; }
  #feed li { display: grid; grid-template-columns: 58px 1fr; gap: 8px; padding: 7px 0; border-bottom: 1px solid var(--grid); font-size: 13px; line-height: 1.4; }
  #feed time { font-family: var(--mono); font-size: 11.5px; color: var(--faint); padding-top: 1px; }
  #feed b { font-weight: 600; text-transform: capitalize; margin-right: 4px; }
  #feed li[data-tone="error"] b { color: var(--error); }
  #feed li[data-tone="approval"] b { color: var(--waiting); }
  #feed li[data-tone="exec"] b { color: var(--executing); }
  #feed li[data-tone="result"] b { color: var(--done); }
  #feed li[data-tone="delegate"] b { color: var(--thinking); }

  @media (max-width: 860px) {
    body { grid-template-columns: 1fr; grid-template-rows: auto 1fr 38vh; }
    aside { border-left: 0; border-top: 1px solid var(--grid); }
    #inspector { display: none; }
    .clock { display: none; }
  }
  @media (prefers-reduced-motion: reduce) {
    .node { animation: none !important; transition: none; }
  }
</style>
</head>
<body>
<header>
  <div class="mission">
    <small id="missionSub">Current mission</small>
    <h1 id="missionTitle">No active mission</h1>
  </div>
  <span class="clock" id="clock">00:00</span>
  <button class="tbtn" id="replayBtn" disabled>Replay mission</button>
  <span class="conn" id="conn" data-s="connecting"><i></i><span>Connecting</span></span>
</header>

<main id="stage" aria-label="Agent execution map">
  <div id="world"><svg id="edges"></svg></div>
  <button class="tbtn" id="recenter" hidden>Recenter map</button>
  <div id="empty">Waiting for the Gateway to report activity</div>
</main>

<aside>
  <section id="inspector"><h2>Selected</h2><div id="inspBody" style="color:var(--muted);font-size:13px">Click any node to see what it's doing.</div></section>
  <section id="feed"><h2>Activity</h2><ol id="feedList"></ol></section>
</aside>

<script>
(() => {
  const EMOJI = { main: '🧠', sysadmin: '🛠️', devops: '🚀', security: '🛡️' };
  const STATUS_TEXT = { idle: 'Standby', thinking: 'Thinking', executing: 'Running', waiting: 'Needs approval', done: 'Done', error: 'Failed' };
  const SIZE = { mission: [300, 48], agent: [224, 96], subagent: [210, 90], tool: [230, 52], approval: [250, 124] };
  const HGAP = 56, VGAP = 88, COLGAP = 12;
  const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;

  const $ = id => document.getElementById(id);
  const stage = $('stage'), world = $('world'), svg = $('edges');
  const NS = 'http://www.w3.org/2000/svg';

  const state = { nodes: new Map(), mission: { label: 'No active mission', startedAt: null }, approvals: false, mode: 'connecting', selected: null };
  const els = new Map();       // id -> { el, path }
  const particles = [];
  let view = { x: 0, y: 0, k: 1 }, userMoved = false;
  let recording = [], replaying = false, liveBuffer = [];

  // ---------- state ops ----------
  function seed(nodes) {
    state.nodes.clear();
    for (const n of nodes) state.nodes.set(n.id, { ...n });
  }
  function applyOps(ops, { record = true } = {}) {
    if (record && !replaying) {
      if (ops.some(o => o.op === 'mission')) recording = [{ t: performance.now(), snapshot: snapshotNodes(), mission: { ...state.mission } }];
      recording.push({ t: performance.now(), ops });
    }
    for (const o of ops) {
      if (o.op === 'mission') {
        state.mission = { label: o.label, startedAt: o.startedAt || Date.now() };
        for (const [id, n] of state.nodes) {
          if (n.kind === 'tool' || n.kind === 'approval') { state.nodes.delete(id); }
          else if (n.kind === 'agent') { n.status = 'idle'; n.detail = ''; }
        }
        const m = state.nodes.get('mission'); if (m) Object.assign(m, { label: o.label, status: 'thinking' });
      } else if (o.op === 'upsert') {
        const prev = state.nodes.get(o.node.id);
        const next = { ...(prev || { status: 'idle' }), ...o.node };
        delete next.idleHint;
        if (!next.label && next.kind === 'agent') next.label = next.id.replace('agent:', '');
        state.nodes.set(next.id, next);
        if (prev && prev.status !== next.status && (next.status === 'done' || next.status === 'error')) flash(next.id, next.status);
      } else if (o.op === 'remove') {
        state.nodes.delete(o.id);
      } else if (o.op === 'pulse') {
        queuePulse(o);
      } else if (o.op === 'log') {
        addFeed(o);
      }
    }
    render();
  }
  const snapshotNodes = () => [...state.nodes.values()].map(n => ({ ...n }));

  // ---------- layout ----------
  const sizeOf = n => SIZE[n.kind] || SIZE.agent;
  function layout() {
    const kids = new Map();
    for (const n of state.nodes.values()) {
      if (!n.parent || !state.nodes.has(n.parent)) continue;
      if (!kids.has(n.parent)) kids.set(n.parent, []);
      kids.get(n.parent).push(n);
    }
    const order = id => { const a = id.replace('agent:', ''); const i = Object.keys(EMOJI).indexOf(a); return i < 0 ? 99 : i; };
    const measure = n => {
      const all = kids.get(n.id) || [];
      n._row = all.filter(k => k.kind === 'agent' || k.kind === 'subagent').sort((a, b) => order(a.id) - order(b.id));
      n._col = all.filter(k => k.kind === 'tool' || k.kind === 'approval');
      n._row.forEach(measure);
      const [w, h] = sizeOf(n);
      n._colH = n._col.reduce((s, k) => s + sizeOf(k)[1] + COLGAP, 0);
      n._side = n._col.length > 0 && n._row.length > 0;
      let L = w / 2, R = w / 2;
      if (n._col.length) {
        const cw = SIZE.tool[0] + 40;
        if (n._side) R = Math.max(R, w / 2 + 28 + cw);
        else { L = Math.max(L, cw / 2 - 4); R = Math.max(R, cw / 2 + 36); }
      }
      const rowW = n._row.reduce((s, k) => s + k._L + k._R, 0) + Math.max(0, n._row.length - 1) * HGAP;
      n._L = Math.max(L, rowW / 2); n._R = Math.max(R, rowW / 2);
    };
    const place = (n, cx, y) => {
      const [w, h] = sizeOf(n);
      n._tx = cx - w / 2; n._ty = y;
      let colLeft = n._side ? cx + w / 2 + 44 : cx - w / 2 + 22;
      let cy = n._side ? y : y + h + 26;
      for (const k of n._col) { k._tx = colLeft; k._ty = cy; k._spine = colLeft - 16; cy += sizeOf(k)[1] + COLGAP; }
      let rowY = y + h + VGAP;
      if (n._side) rowY = Math.max(rowY, y + n._colH + 40);
      else if (n._col.length) rowY = cy + 40;
      const rowW = n._row.reduce((s, k) => s + k._L + k._R, 0) + Math.max(0, n._row.length - 1) * HGAP;
      let x = cx - rowW / 2;
      for (const k of n._row) { place(k, x + k._L, rowY); x += k._L + k._R + HGAP; }
    };
    const root = state.nodes.get('mission');
    if (!root) return;
    measure(root); place(root, 0, 0);
    for (const n of state.nodes.values()) if (n._tx === undefined) { n._tx = 0; n._ty = -200; }
  }

  // ---------- rendering ----------
  function nodeHtml(n) {
    const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
    const st = `<div class="st"><i></i>${STATUS_TEXT[n.status] || n.status}</div>`;
    if (n.kind === 'mission') return `<div class="name" title="${esc(n.label)}">🎯 ${esc(n.label)}</div>`;
    if (n.kind === 'tool') return `<div class="detail" title="${esc(n.label)}">${esc(n.label)}</div>${st}`;
    if (n.kind === 'approval') {
      const dis = n.status !== 'waiting' || (!state.approvals && state.mode !== 'demo') ? 'disabled' : '';
      const note = !state.approvals && state.mode !== 'demo' && n.status === 'waiting' ? '<div class="meta">Read-only: approve in OpenClaw</div>' : '';
      return `<div class="row"><span class="name" style="text-transform:none">Approval</span></div>${st}
        <div class="detail" title="${esc(n.label)}">${esc(n.label)}</div>
        ${n.status === 'waiting' ? `<div class="actions"><button class="yes" data-act="approve" ${dis}>Approve</button><button data-act="reject" ${dis}>Reject</button></div>${note}` : `<div class="meta">${esc(n.detail)}</div>`}`;
    }
    const name = n.label || n.id;
    const emoji = EMOJI[name] || '🤖';
    const counts = [...state.nodes.values()].filter(k => k.parent === n.id && k.kind === 'tool').length;
    return `<div class="row"><span>${emoji}</span><span class="name">${esc(name)}</span></div>${st}
      <div class="detail">${esc(n.detail || '')}&nbsp;</div>
      <div class="meta">${esc(n.model || '')}${n.model && counts ? '  •  ' : ''}${counts ? counts + (counts === 1 ? ' tool call' : ' tool calls') : ''}</div>`;
  }

  function render() {
    layout();
    const seen = new Set();
    for (const n of state.nodes.values()) {
      seen.add(n.id);
      let rec = els.get(n.id);
      const [w, h] = sizeOf(n);
      if (!rec) {
        const el = document.createElement('div');
        el.addEventListener('click', e => onNodeClick(n.id, e));
        const path = document.createElementNS(NS, 'path'); path.setAttribute('class', 'edge');
        svg.appendChild(path);
        const parent = n.parent && state.nodes.get(n.parent);
        rec = { el, path, x: parent?._x ?? n._tx, y: parent?._y ?? n._ty };
        if (n.kind !== 'mission' && parent) { rec.x = parent._tx + 20; rec.y = parent._ty + 20; }
        els.set(n.id, rec); world.appendChild(el);
      }
      rec.el.className = `node ${n.kind}${state.selected === n.id ? ' selected' : ''}`;
      rec.el.dataset.status = n.status;
      rec.el.style.width = w + 'px';
      if (n.kind !== 'approval') rec.el.style.height = h + 'px'; else rec.el.style.minHeight = h + 'px';
      const html = nodeHtml(n);
      if (rec.html !== html) { rec.el.innerHTML = html; rec.html = html; }
      rec.path.classList.toggle('hot', n.status === 'thinking' || n.status === 'executing');
    }
    for (const [id, rec] of els) if (!seen.has(id)) { rec.el.remove(); rec.path.remove(); els.delete(id); }
    $('missionTitle').textContent = state.mission.label;
    $('missionSub').textContent = state.mission.startedAt ? (replaying ? 'Replaying mission' : 'Current mission') : 'Standing by';
    $('replayBtn').disabled = replaying || recording.length < 2;
    $('empty').hidden = state.mission.startedAt || [...state.nodes.values()].some(n => n.status !== 'idle');
    if (state.selected) inspect(state.selected);
    if (!userMoved) fit();
  }

  function edgePath(n, x, y) {
    const p = state.nodes.get(n.parent); const pr = p && els.get(p.id);
    if (!p || !pr) return '';
    const [pw, ph] = sizeOf(p); const [w, h] = sizeOf(n);
    if (n.kind === 'tool' || n.kind === 'approval') {
      const sx = n._spine + (x - n._tx);
      const my = y + h / 2;
      const r = 8;
      const start = p._side ? `M ${pr.x + pw} ${pr.y + 30} H ${sx - r} Q ${sx} ${pr.y + 30} ${sx} ${pr.y + 30 + r}` : `M ${sx} ${pr.y + ph}`;
      return `${start} V ${my - r} Q ${sx} ${my} ${sx + r} ${my} H ${x}`;
    }
    const x1 = pr.x + pw / 2, y1 = pr.y + ph, x2 = x + w / 2, y2 = y;
    const c = Math.max(30, (y2 - y1) * 0.5);
    return `M ${x1} ${y1} C ${x1} ${y1 + c} ${x2} ${y2 - c} ${x2} ${y2}`;
  }

  function frame(now) {
    const ease = reduced ? 1 : 0.16;
    for (const n of state.nodes.values()) {
      const rec = els.get(n.id); if (!rec) continue;
      rec.x += (n._tx - rec.x) * ease; rec.y += (n._ty - rec.y) * ease;
      if (Math.abs(n._tx - rec.x) < 0.3) rec.x = n._tx;
      if (Math.abs(n._ty - rec.y) < 0.3) rec.y = n._ty;
      rec.el.style.transform = `translate(${rec.x}px, ${rec.y}px)`;
    }
    for (const n of state.nodes.values()) {
      const rec = els.get(n.id); if (!rec) continue;
      const d = edgePath(n, rec.x, rec.y);
      if (rec.d !== d) { rec.path.setAttribute('d', d); rec.d = d; }
    }
    // particles
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      const rec = els.get(p.edge);
      if (!rec || !rec.d) { p.dots.forEach(d => d.remove()); particles.splice(i, 1); continue; }
      const t = (now - p.start) / p.dur;
      if (t >= 1) { p.dots.forEach(d => d.remove()); particles.splice(i, 1); if (p.onDone) p.onDone(); continue; }
      const len = rec.path.getTotalLength();
      p.dots.forEach((dot, j) => {
        let tt = Math.min(1, Math.max(0, t * 1.25 - j * 0.1));
        tt = tt < .5 ? 2 * tt * tt : 1 - Math.pow(-2 * tt + 2, 2) / 2;
        const pt = rec.path.getPointAtLength((p.reverse ? 1 - tt : tt) * len);
        dot.setAttribute('cx', pt.x); dot.setAttribute('cy', pt.y);
        dot.setAttribute('opacity', tt <= 0 || tt >= 1 ? 0 : 1 - j * 0.28);
      });
    }
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.k})`;
    requestAnimationFrame(frame);
  }

  function queuePulse({ from, to, tone }) {
    // the edge belongs to the child; travel direction depends on which end is the child
    const a = state.nodes.get(from), b = state.nodes.get(to);
    if (!a || !b) return;
    let edge, reverse;
    if (b.parent === from) { edge = to; reverse = false; }
    else if (a.parent === to) { edge = from; reverse = true; }
    else return;
    if (reduced) { flash(to, tone === 'error' ? 'error' : 'done'); return; }
    const dots = [0, 1, 2].map(() => { const c = document.createElementNS(NS, 'circle'); c.setAttribute('r', 4); c.setAttribute('class', `particle ${tone || ''}`); c.setAttribute('opacity', 0); svg.appendChild(c); return c; });
    particles.push({ edge, reverse, dots, start: performance.now(), dur: 1100 });
  }

  function flash(id, status) {
    const rec = els.get(id); if (!rec) return;
    rec.el.style.setProperty('--flash', `var(--${status === 'error' ? 'error' : 'done'})`);
    rec.el.classList.add('flash'); setTimeout(() => rec.el.classList.remove('flash'), 500);
  }

  // ---------- view ----------
  function bounds() {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (const n of state.nodes.values()) { const [w, h] = sizeOf(n); x0 = Math.min(x0, n._tx); y0 = Math.min(y0, n._ty); x1 = Math.max(x1, n._tx + w); y1 = Math.max(y1, n._ty + h); }
    return { x0, y0, x1, y1 };
  }
  function fit() {
    const b = bounds(); if (!isFinite(b.x0)) return;
    const W = stage.clientWidth, H = stage.clientHeight, pad = 48;
    const k = Math.min(1.05, (W - pad * 2) / (b.x1 - b.x0), (H - pad * 2) / (b.y1 - b.y0));
    view.k = Math.max(0.35, k);
    view.x = W / 2 - ((b.x0 + b.x1) / 2) * view.k;
    view.y = Math.max(pad, (H - (b.y1 - b.y0) * view.k) / 2) - b.y0 * view.k;
  }
  let drag = null;
  stage.addEventListener('pointerdown', e => { if (e.target.closest('.node, button')) return; drag = { x: e.clientX, y: e.clientY, vx: view.x, vy: view.y }; stage.classList.add('dragging'); stage.setPointerCapture(e.pointerId); });
  stage.addEventListener('pointermove', e => { if (!drag) return; view.x = drag.vx + e.clientX - drag.x; view.y = drag.vy + e.clientY - drag.y; setMoved(); });
  stage.addEventListener('pointerup', () => { drag = null; stage.classList.remove('dragging'); });
  stage.addEventListener('wheel', e => {
    e.preventDefault();
    const r = stage.getBoundingClientRect(), mx = e.clientX - r.left, my = e.clientY - r.top;
    const k = Math.min(2, Math.max(0.25, view.k * Math.exp(-e.deltaY * 0.0015)));
    view.x = mx - (mx - view.x) * (k / view.k); view.y = my - (my - view.y) * (k / view.k); view.k = k; setMoved();
  }, { passive: false });
  const setMoved = () => { userMoved = true; $('recenter').hidden = false; };
  $('recenter').onclick = () => { userMoved = false; $('recenter').hidden = true; fit(); };
  addEventListener('resize', () => { if (!userMoved) fit(); });

  // ---------- inspector, feed, clock ----------
  function onNodeClick(id, e) {
    const act = e.target.closest('button[data-act]');
    if (act) { resolveApproval(id, act.dataset.act); return; }
    state.selected = state.selected === id ? null : id; render();
  }
  function inspect(id) {
    const n = state.nodes.get(id);
    const body = $('inspBody');
    if (!n) { body.textContent = 'That node has left the map.'; return; }
    const esc = s => String(s ?? '').replace(/[&<>]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]));
    const kids = [...state.nodes.values()].filter(k => k.parent === id);
    const rows = [
      ['Status', STATUS_TEXT[n.status] || n.status],
      n.detail && ['Detail', `<code>${esc(n.detail)}</code>`],
      n.model && ['Model', esc(n.model)],
      n.parent && ['Reports to', esc(n.parent.replace(/^agent:/, ''))],
      kids.length && ['Children', kids.length],
    ].filter(Boolean);
    body.innerHTML = `<div class="big">${esc(n.kind === 'tool' ? 'Tool call' : n.kind === 'mission' ? 'Mission' : n.label)}</div>
      ${n.kind === 'tool' || n.kind === 'mission' || n.kind === 'approval' ? `<div style="font-family:var(--mono);font-size:12px;margin-top:6px;overflow-wrap:anywhere">${esc(n.label)}</div>` : ''}
      <dl>${rows.map(([k, v]) => `<dt>${k}</dt><dd>${v}</dd>`).join('')}</dl>`;
  }
  function addFeed(o) {
    const li = document.createElement('li');
    li.dataset.tone = o.tone || '';
    const d = new Date(o.at || Date.now());
    li.innerHTML = `<time>${d.toTimeString().slice(0, 8)}</time><span><b></b><span></span></span>`;
    li.querySelector('b').textContent = o.agent || '';
    li.querySelector('span span').textContent = o.text;
    const list = $('feedList'); list.prepend(li);
    while (list.children.length > 150) list.lastChild.remove();
  }
  setInterval(() => {
    const s = state.mission.startedAt ? Math.floor((Date.now() - state.mission.startedAt) / 1000) : 0;
    $('clock').textContent = `${String(Math.floor(s / 60)).padStart(2, '0')}:${String(s % 60).padStart(2, '0')}`;
  }, 500);
  function setConn(mode, text) {
    state.mode = mode; $('conn').dataset.s = mode;
    $('conn').querySelector('span').textContent = text;
  }

  // ---------- approvals ----------
  async function resolveApproval(id, decision) {
    const n = state.nodes.get(id); if (!n || n.status !== 'waiting') return;
    if (state.mode === 'demo') { demo.resolve(id, decision); return; }
    try {
      const r = await fetch('/api/approval', { method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ approvalId: n.approvalId, decision }) });
      const j = await r.json().catch(() => ({}));
      if (!r.ok || j.ok === false) throw new Error(j.error || `HTTP ${r.status}`);
    } catch (err) {
      addFeed({ agent: 'mission control', text: `Couldn't send the decision: ${err.message}`, tone: 'error' });
    }
  }

  // ---------- replay ----------
  $('replayBtn').onclick = async () => {
    if (recording.length < 2 || replaying) return;
    const rec = recording.slice();
    const start = rec[0];
    replaying = true; liveBuffer = [];
    const saved = { nodes: snapshotNodes(), mission: { ...state.mission } };
    seed(start.snapshot); state.mission = { ...start.mission };
    $('feedList').innerHTML = '';
    render();
    let last = start.t;
    for (const step of rec.slice(1)) {
      await new Promise(r => setTimeout(r, Math.min(900, (step.t - last) / 3)));
      last = step.t;
      applyOps(step.ops, { record: false });
    }
    await new Promise(r => setTimeout(r, 800));
    replaying = false;
    seed(saved.nodes); state.mission = saved.mission;
    const buffered = liveBuffer; liveBuffer = [];
    render();
    buffered.forEach(m => handle(m));
  };

  // ---------- transport ----------
  function handle(msg) {
    if (replaying && msg.type !== 'status') { liveBuffer.push(msg); return; }
    if (msg.type === 'snapshot') {
      seed(msg.nodes); state.mission = msg.mission || state.mission; state.approvals = !!msg.approvals;
      $('feedList').innerHTML = ''; (msg.log || []).forEach(addFeed);
      recording = [{ t: performance.now(), snapshot: snapshotNodes(), mission: { ...state.mission } }];
      setConnFromStatus(msg.status);
      render();
    } else if (msg.type === 'ops') {
      applyOps(msg.ops);
    } else if (msg.type === 'status') {
      state.approvals = !!msg.approvals; setConnFromStatus(msg.status, msg.detail);
    }
  }
  function setConnFromStatus(s, detail) {
    const text = { live: 'Gateway live', connecting: 'Connecting', reconnecting: 'Reconnecting', error: 'Gateway refused connection' }[s] || s;
    setConn(s, text);
    if (detail) $('conn').title = detail;
  }

  function startLive() {
    const es = new EventSource('events');
    let opened = false;
    es.onmessage = e => { opened = true; handle(JSON.parse(e.data)); };
    es.onerror = () => { if (!opened) { es.close(); startDemo(); } else setConn('reconnecting', 'Mission Control offline'); };
  }

  // ---------- demo (used when no backend is reachable) ----------
  const demo = (() => {
    let timers = [], waitingFor = null;
    const agents = ['main', 'sysadmin', 'devops', 'security'];
    const base = () => [
      { id: 'mission', kind: 'mission', label: 'No active mission', status: 'idle' },
      ...agents.map((a, i) => ({ id: `agent:${a}`, kind: 'agent', label: a, status: 'idle', parent: i ? 'agent:main' : 'mission', model: 'deepseek-v4-flash' })),
    ];
    const A = a => `agent:${a}`;
    const up = (node) => ({ op: 'upsert', node });
    const log = (agent, text, tone) => ({ op: 'log', agent, text, tone, at: Date.now() });
    const pulse = (from, to, tone) => ({ op: 'pulse', from, to, tone });
    const tool = (agent, id, label, status, detail) => up({ id: `tool:${id}`, parent: A(agent), kind: 'tool', label, status, detail });

    const script = [
      [800, () => [{ op: 'mission', label: "Find out why Mailcow isn't receiving mail", startedAt: Date.now() }, up({ id: A('main'), status: 'thinking' }), pulse('mission', A('main'), 'delegate'), log('main', "New mission: find out why Mailcow isn't receiving mail", 'delegate')]],
      [2200, () => [up({ id: A('main'), detail: 'Planning the investigation' })]],
      [1600, () => [up({ id: A('sysadmin'), status: 'thinking', detail: 'Checking the mail stack' }), pulse(A('main'), A('sysadmin'), 'delegate'), log('sysadmin', 'Picked up work from main', 'delegate'), up({ id: A('main'), detail: 'Waiting on sysadmin' })]],
      [1500, () => [tool('sysadmin', 1, 'docker ps --filter name=mailcow', 'executing'), up({ id: A('sysadmin'), status: 'executing', detail: 'docker ps --filter name=mailcow' }), pulse(A('sysadmin'), 'tool:1', 'exec'), log('sysadmin', 'Running docker ps --filter name=mailcow', 'exec')]],
      [1900, () => [tool('sysadmin', 1, 'docker ps --filter name=mailcow', 'done', '18 containers up, postfix restarting'), up({ id: A('sysadmin'), status: 'thinking', detail: '' }), pulse('tool:1', A('sysadmin'), 'result'), log('sysadmin', 'postfix-mailcow is in a restart loop', 'result')]],
      [1400, () => [tool('sysadmin', 2, 'docker logs postfix-mailcow --tail 80', 'executing'), up({ id: A('sysadmin'), status: 'executing', detail: 'docker logs postfix-mailcow' }), pulse(A('sysadmin'), 'tool:2', 'exec'), log('sysadmin', 'Running docker logs postfix-mailcow --tail 80', 'exec')]],
      [2100, () => [tool('sysadmin', 2, 'docker logs postfix-mailcow --tail 80', 'done', 'TLS: certificate expired'), up({ id: A('sysadmin'), status: 'thinking', detail: '' }), pulse('tool:2', A('sysadmin'), 'result'), log('sysadmin', 'Found an expired TLS certificate', 'result')]],
      [1300, () => [up({ id: A('security'), status: 'thinking', detail: 'Reviewing certificate chain' }), pulse(A('main'), A('security'), 'delegate'), log('security', 'Picked up work from main', 'delegate')]],
      [1200, () => [tool('security', 3, 'openssl s_client -connect mail:25 -starttls smtp', 'executing'), up({ id: A('security'), status: 'executing', detail: 'openssl s_client …' }), pulse(A('security'), 'tool:3', 'exec'), log('security', 'Running openssl s_client -starttls smtp', 'exec')]],
      [2000, () => [tool('security', 3, 'openssl s_client -connect mail:25 -starttls smtp', 'done', 'notAfter: 3 days ago'), up({ id: A('security'), status: 'done', detail: 'Cert expired, no tampering' }), pulse('tool:3', A('security'), 'result'), pulse(A('security'), A('main'), 'result'), log('security', 'Reported: certificate expired, no signs of tampering', 'result')]],
      [1500, () => { waitingFor = 'approval:1'; return [up({ id: 'approval:1', parent: A('sysadmin'), kind: 'approval', label: 'systemctl restart mailcow-acme && docker compose restart postfix-mailcow', status: 'waiting' }), up({ id: A('sysadmin'), status: 'waiting', detail: 'Waiting for your approval' }), pulse(A('sysadmin'), 'approval:1', 'approval'), log('sysadmin', 'Needs approval: renew certificate and restart postfix', 'approval')]; }],
    ];
    const after = [
      [1400, () => [tool('sysadmin', 4, 'docker compose restart postfix-mailcow', 'executing'), up({ id: A('sysadmin'), status: 'executing', detail: 'docker compose restart postfix-mailcow' }), pulse(A('sysadmin'), 'tool:4', 'exec'), log('sysadmin', 'Running docker compose restart postfix-mailcow', 'exec')]],
      [2200, () => [tool('sysadmin', 4, 'docker compose restart postfix-mailcow', 'done', 'postfix healthy'), up({ id: A('sysadmin'), status: 'done', detail: 'Mail flowing again' }), pulse('tool:4', A('sysadmin'), 'result'), pulse(A('sysadmin'), A('main'), 'result'), log('sysadmin', 'Reported: certificate renewed, postfix healthy', 'result')]],
      [1600, () => [up({ id: A('main'), status: 'done', detail: 'Mission complete' }), up({ id: 'mission', status: 'done' }), log('main', 'Mission complete in one approval', 'result')]],
      [7000, () => { run(true); return []; }],
    ];
    function play(steps) {
      let at = 0;
      for (const [delay, fn] of steps) { at += delay; timers.push(setTimeout(() => { const ops = fn(); if (ops.length) applyOps(ops); }, at)); }
    }
    function run(again) {
      timers.forEach(clearTimeout); timers = [];
      handle({ type: 'snapshot', nodes: base(), mission: { label: 'No active mission', startedAt: null }, log: [], approvals: true, status: 'demo' });
      setConn('demo', 'Demo data');
      play(script);
    }
    function resolve(id, decision) {
      if (id !== waitingFor) return;
      waitingFor = null;
      const ok = decision === 'approve';
      applyOps([up({ id, status: ok ? 'done' : 'error', detail: ok ? 'Approved' : 'Rejected' }), up({ id: A('sysadmin'), status: ok ? 'thinking' : 'idle', detail: '' }), pulse(id, A('sysadmin'), ok ? 'result' : 'error'), log('you', ok ? 'Approved the restart' : 'Rejected the restart', ok ? 'result' : 'error')]);
      if (ok) play(after);
      else play([[1500, () => [up({ id: A('main'), status: 'idle', detail: 'Paused: restart rejected' }), up({ id: 'mission', status: 'error' }), log('main', 'Mission paused after rejection', 'error')]], [6000, () => { run(); return []; }]]);
    }
    return { run, resolve };
  })();
  function startDemo() { demo.run(); }

  requestAnimationFrame(frame);
  const isServed = location.protocol.startsWith('http') && !/claude|anthropic/.test(location.hostname) && !new URLSearchParams(location.search).has('demo');
  if (isServed) startLive(); else startDemo();
})();
</script>
</body>
</html>
